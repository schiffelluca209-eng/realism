name: Build UltraRealism

on:
  workflow_dispatch:
  push:
    paths:
      - 'UltraRealism-Fabric-26.3-Expanded/UltraRealism/**'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Build mod
        working-directory: UltraRealism-Fabric-26.3-Expanded/UltraRealism
        run: gradle build

      - name: Save JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: UltraRealism-JAR
          path: UltraRealism-Fabric-26.3-Expanded/UltraRealism/build/libs/*.jar
